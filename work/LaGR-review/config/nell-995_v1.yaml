trainer:
  max_epochs: 10
data:
  batch_size: 128
model:
  hidden_size: 64
  graph_norm: TANH
  attn_norm: TANH
  attn_intermediate_size: 256
  loss_fn: bce
  num_negative_sample: 4800
  adversarial_temperature: 1.0
  use_scheduler: false
  attn_leaders: 500
  delta: 5
  weight_decay: 1e-5